[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-agentic-ai-labs"
version = "0.1.0"
description = "A practical learning and engineering project for Forward Deployed Engineering and Agentic AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7.0",
]

[tool.setuptools]
package-dir = {"" = "src", "labs" = "labs"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fde_agent*", "labs*"]
namespaces = true
